on:
  schedule: 

    # runs every tuesday @ 3:00pm
    - cron: "0 14 * * 0"

    
jobs:
  # This workflow contains a single job called "traffic"
  traffic:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      deployments: read
      packages: none
      pull-requests: write
      security-events: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: "traffic"
    
    # Calculates traffic and clones and stores in CSV file
    - name: Repository Traffic
      uses: sangonzal/repository-traffic-action@404df77a0bfb110f8977fe14ddba62451ec868b7 # v.0.1.6     
      env:
        TRAFFIC_ACTION_TOKEN: ${{secrets.TRAFFIC_ACTION_TOKEN}} 
     
    # Commits files to repository
    - name: Commit changes
      uses: EndBug/add-and-commit@a988073222b8bd50f3ecfca9c0ab7dfbf0d08ceb # v4.4.0
      with:
        author_name: Tobi Otolorin
        message: "GitHub traffic"
        add: "./traffic/*"
        ref: "traffic"  # commits to branch "traffic"

